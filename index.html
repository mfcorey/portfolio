<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            font-family: monospace;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            text-align: center;
            border: 1px solid #30363d;
            padding: 40px;
            border-radius: 6px;
            background-color: #161b22;
        }
        h1 { color: #58a6ff; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Hello World.</h1>
        <p>Status: Portfolio site under construction.</p>
    </div>
</body>
</html>
